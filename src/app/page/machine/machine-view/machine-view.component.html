<span tabindex="0" #resetFocus></span>
<div class="fiche-machine">
  <div class="label" style="grid-row-start: 1; grid-row-end: 4;">Client :</div>
  <div style="grid-row-start: 1; grid-row-end: 4; white-space: pre;">{{ proprietaire()?.toAdresseFormat() }}</div>

  <div class="label">Machine :</div>
  <div>
    <mat-form-field (click)="this.editMachine()" (keydown.enter)="this.editMachine()">
      <input matInput [value]="machine()?.nom" [readonly]="true"/>
    </mat-form-field>
  </div>

  <div class="label">Numero de chassis :</div>
  <div>
    <mat-form-field (click)="this.editMachine()" (keydown.enter)="this.editMachine()">
      <input matInput [value]="machine()?.numeroChassis" [readonly]="true"/>
    </mat-form-field>
  </div>

  <div class="label">Description :</div>
  <div>
    <mat-form-field (click)="this.editMachine()" (keydown.enter)="this.editMachine()">
      <textarea matInput [value]="machine()?.description" [readonly]="true" [rows]="1"></textarea>
    </mat-form-field>
  </div>
</div>

<mat-tab-group>
  <mat-tab label="Pièces">
    <div class="pieces-tab">
    @if (this.machine()) {
      <app-machine-view-piece [machine]="this.machine()!"
                              (machineChanged)="this.machine.set($event)"
                              [canEdit]="this.hasEditAccess()"/>
    }
    </div>
  </mat-tab>
  <mat-tab label="Services">
    <div class="service-tab">
      @if (this.machine()) {
        <app-machine-view-service [machine]="this.machine()!"
                                  [canEdit]="this.hasEditAccess()"/>
      }
    </div>
  </mat-tab>
</mat-tab-group>
