<app-table title="Liste des services effectués sur la machine"
           [(columns)]="this.columns"
           [initSearchQueryMethod]="this.getSearchQueryMethod.bind(this)"
           [updateMethod]="this.getUpdateMethod.bind(this)"
           [actionColumnInfo]="actionColumnInfo"
           [readAccessRole]="Roles.R_SERVICE_LECTEUR"
           [editAccessRole]="Roles.R_SERVICE_EDITEUR">
  <ng-container [matColumnDef]="'rowExtender'">
    <th mat-header-cell
        *matHeaderCellDef
        [style.width]="'10%'">
    </th>
    <td mat-cell
        *matCellDef="let element"
        class="row-extender">
      <button mat-icon-button
              [matBadge]="element.changementPieces.length"
              (keydown.enter)="$event.stopPropagation(); togglePieces(element)"
              (click)="$event.stopPropagation(); togglePieces(element)">
        <mat-icon>
          @if (element.id === this.extendedRowId) {
            folder_open
          } @else {
            folder_off
          }
        </mat-icon>
      </button>
    </td>
  </ng-container>
  <ng-container [matColumnDef]="'piecesLiees'">
    <td mat-cell
        *matCellDef="let element"
        class="extended-row"
        [attr.colspan]="this.columns.length + 1">
      <app-changement-piece-table [service]="element"></app-changement-piece-table>
    </td>
  </ng-container>
  <tr mat-row *matRowDef="let row; columns: ['piecesLiees']; when: this.viewRow.bind(this)"></tr>
</app-table>
