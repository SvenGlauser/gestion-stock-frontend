<button mat-icon-button
        [matMenuTriggerFor]="menu"
        (menuOpened)="this.menuOpened()"
        (menuClosed)="this.menuClosed()">
  <mat-icon>
    @if (this.isMenuOpen()) {
      close
    } @else {
      settings
    }
  </mat-icon>
</button>

<mat-menu #menu="matMenu">
  @for (column of this.columns(); track column.field) {
    @if (!column.hideInChooser) {
      <mat-checkbox class="checkbox"
                    [(ngModel)]="column.view"
                    (change)="this.changed()"
                    (click)="$event.stopPropagation()"
                    (keydown)="$event.stopPropagation()"
                    [disabled]="column.view && this.isUnselectImpossible()" >
        {{ column.label }}
      </mat-checkbox>
    }
  }
</mat-menu>
